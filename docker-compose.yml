version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:18-alpine
    container_name: lockmyseat-db
    environment:
      POSTGRES_DB: lockmyseat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: breaking@bad
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lockmyseat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Plain Java 21 Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lockmyseat-backend
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      DB_URL: "jdbc:postgresql://postgres:5432/lockmyseat"
      DB_USER: "postgres"
      DB_PASSWORD: "breaking@bad"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
    container_name: lockmyseat-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8081/api"
    depends_on:
      - backend

volumes:
  postgres_data:
